[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "2026.09.00"
lifecycle = "2.11.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
androidx-core = "androidx.core:core-ktx:1.19.0"
androidx-activity = "androidx.activity:activity-compose:1.13.0"
androidx-window = "androidx.window:window:1.5.1"
androidx-datastore = "androidx.datastore:datastore-preferences:1.2.1"
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coroutines = "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
